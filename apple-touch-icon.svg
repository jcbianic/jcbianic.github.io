<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Solid dark bg — iOS clips to rounded rect, needs opaque background -->
  <rect width="32" height="32" rx="6" fill="#18181b"/>

  <!-- Outer hull — REST_VERTS mask shape (matches OrigamiIcon.vue rest state) -->
  <polygon
    points="3,15 8,7 13,13 16,9 19,13 24,7 29,15 16,27"
    fill="none"
    stroke="#f59e0b"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- 8 fold crease lines to neutral center (16,16) -->
  <line x1="3"  y1="15" x2="16" y2="16" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="8"  y1="7"  x2="16" y2="16" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="13" y1="13" x2="16" y2="16" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="16" y1="9"  x2="16" y2="16" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="19" y1="13" x2="16" y2="16" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="24" y1="7"  x2="16" y2="16" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="29" y1="15" x2="16" y2="16" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="16" y1="27" x2="16" y2="16" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.6"/>

  <!-- Fold center dot -->
  <circle cx="16" cy="16" r="1.6" fill="#f59e0b"/>
</svg>
