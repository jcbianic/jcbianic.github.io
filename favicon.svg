<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Brand favicon: mask silhouette, transparent background, amber wireframe.
    Two concave eye sockets at (13,13) and (19,13) flanked by brow peaks.
    Fold center at (16,16) — radial creases read as the mask's fold structure.
  -->
  <polygon
    points="3,15 8,7 13,13 16,9 19,13 24,7 29,15 16,27"
    fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"
  />
  <line x1="3"  y1="15" x2="16" y2="16" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="8"  y1="7"  x2="16" y2="16" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="13" y1="13" x2="16" y2="16" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="16" y1="9"  x2="16" y2="16" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="19" y1="13" x2="16" y2="16" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="24" y1="7"  x2="16" y2="16" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="29" y1="15" x2="16" y2="16" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="16" y1="27" x2="16" y2="16" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.55"/>
  <circle cx="16" cy="16" r="1.6" fill="#f59e0b"/>
</svg>
